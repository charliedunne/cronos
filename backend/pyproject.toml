[project]
name = "cronos-backend"
version = "0.1.0"
description = "Cronos requirements management - backend API"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "pydantic-settings>=2.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Intentionally triggering the locks primary key in tests emits a benign
    # identity-map conflict warning during the failing flush.
    "ignore:New instance .* conflicts with persistent instance:sqlalchemy.exc.SAWarning",
]
