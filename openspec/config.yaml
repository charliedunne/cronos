schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
context: |
  Cronos is a collaborative requirements management web application (in the spirit of DOORS and Polarion).
  Stack: Python + FastAPI backend exposing a versioned JSON REST API, TypeScript + React frontend, PostgreSQL database.
  Editing model: lock-based — a user blocks an element before editing it and unblocks it afterwards; no live co-editing.
  Requirements have a fixed attribute set in the foundation: title, text, status, priority.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
